<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haley's Recipe Book</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Haley's Recipe Book</h1>
    <p>A searchable local collection of recipes, images, categories, and tags.</p>
  </header>

  <section class="controls" aria-label="Recipe filters">
    <input id="search" type="search" placeholder="Search recipes, ingredients, or tags…">
    <select id="category"><option value="">All categories</option></select>
    <select id="tag"><option value="">All tags</option></select>
  </section>

  <div class="layout">
    <aside>
      <p class="count" id="count"></p>
      <div class="cards" id="cards"></div>
    </aside>
    <main id="reader">
      <div class="empty">Select a recipe to open it.</div>
    </main>
  </div>

  <script src="generated/recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
