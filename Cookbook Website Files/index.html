<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haley's Recipe Book</title>
  <style>
    :root {
      --pine:#24483a;
      --pine-2:#365f4d;
      --cream:#f7f3ea;
      --paper:#fffdf8;
      --gold:#b8974f;
      --ink:#222821;
      --muted:#687168;
      --line:#d8d2c6;
      --chip:#ece7d9;
    }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--cream); font-family:Georgia, 'Times New Roman', serif; }
    button, input, select { font:inherit; }
    header {
      background:var(--pine); color:white; padding:22px 26px 18px;
      border-bottom:4px solid var(--gold);
      position:sticky; top:0; z-index:10;
    }
    header h1 { margin:0 0 4px; font-size:clamp(1.6rem,4vw,2.5rem); font-weight:600; }
    header p { margin:0; color:#e8efe9; font-family:Arial,sans-serif; font-size:.95rem; }
    .controls {
      display:grid; grid-template-columns:minmax(220px,2fr) minmax(170px,1fr) minmax(170px,1fr);
      gap:10px; padding:16px 22px; background:#eee8dc; border-bottom:1px solid var(--line);
      position:sticky; top:92px; z-index:9;
    }
    .controls input,.controls select {
      width:100%; padding:10px 12px; border:1px solid #bdb5a6; border-radius:8px; background:white;
    }
    .layout { display:grid; grid-template-columns:360px minmax(0,1fr); min-height:calc(100vh - 160px); }
    aside { border-right:1px solid var(--line); padding:18px; background:#f0ebdf; }
    .count { color:var(--muted); font-family:Arial,sans-serif; margin:0 0 12px; }
    .cards { display:grid; gap:12px; }
    .card {
      width:100%; text-align:left; border:1px solid var(--line); background:var(--paper);
      border-radius:10px; overflow:hidden; cursor:pointer; padding:0;
    }
    .card:hover,.card.active { border-color:var(--gold); box-shadow:0 0 0 2px rgba(184,151,79,.16); }
    .card img { width:100%; height:150px; object-fit:cover; display:block; background:#ddd5c7; }
    .card-body { padding:12px; }
    .card h3 { margin:0 0 5px; font-size:1.05rem; }
    .card .meta { font-family:Arial,sans-serif; color:var(--muted); font-size:.84rem; }
    main { padding:28px clamp(20px,5vw,70px) 70px; background:var(--paper); }
    .empty { color:var(--muted); margin-top:16vh; text-align:center; }
    .recipe-header { max-width:1100px; margin:0 auto 22px; }
    .recipe-title { font-size:clamp(2rem,5vw,3.5rem); color:var(--pine); margin:8px 0 8px; line-height:1.05; }
    .recipe-layout {
      display:grid;
      grid-template-columns:minmax(220px,300px) minmax(0,1fr);
      gap:34px;
      align-items:start;
      max-width:1100px;
      margin:0 auto;
    }
    .recipe-sidebar { position:sticky; top:178px; }
    .recipe-image {
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      border-radius:12px;
      border:1px solid var(--line);
      display:block;
      background:#ddd5c7;
    }
    .glance-card {
      margin-top:14px;
      padding:16px;
      border:1px solid var(--line);
      border-top:4px solid var(--gold);
      border-radius:10px;
      background:#f5f1e7;
    }
    .glance-card h2 {
      margin:0 0 12px;
      color:var(--pine);
      font-size:1.1rem;
      border:0;
      padding:0;
    }
    .glance-list { display:grid; gap:9px; margin:0; }
    .glance-row {
      display:grid;
      grid-template-columns:78px minmax(0,1fr);
      gap:8px;
      font-family:Arial,sans-serif;
      font-size:.88rem;
      line-height:1.3;
    }
    .glance-row dt { font-weight:bold; color:var(--pine); }
    .glance-row dd { margin:0; color:#40463f; }
    .category { text-transform:uppercase; letter-spacing:.12em; color:var(--gold); font-family:Arial,sans-serif; font-weight:bold; font-size:.78rem; }
    .fact,.tag { font-family:Arial,sans-serif; font-size:.84rem; border-radius:999px; padding:6px 10px; }
    .tag { background:var(--chip); color:#4c514b; }
    .recipe-body { max-width:780px; line-height:1.58; font-size:1.02rem; }
    .recipe-body h2 { color:var(--pine); border-bottom:1px solid var(--gold); padding-bottom:5px; margin-top:30px; }
    .recipe-body h3 { color:var(--pine-2); }
    .recipe-body li { margin-bottom:7px; }
    .source { margin-top:32px; padding-top:15px; border-top:1px solid var(--line); font-family:Arial,sans-serif; font-size:.9rem; overflow-wrap:anywhere; }
    .source a { color:var(--pine-2); }
    .tag-wrap { display:flex; flex-wrap:wrap; gap:6px; margin-top:22px; }
    @media (max-width:850px) {
      header { position:static; }
      .controls { position:static; grid-template-columns:1fr; }
      .layout { grid-template-columns:1fr; }
      aside { border-right:0; border-bottom:1px solid var(--line); }
      .cards { grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); }
      main { min-height:60vh; }
      .recipe-layout { grid-template-columns:1fr; gap:22px; }
      .recipe-sidebar { position:static; }
      .recipe-image { max-height:320px; aspect-ratio:16/9; }
    }
    @media print {
      header,.controls,aside { display:none!important; }
      .layout { display:block; }
      main { padding:0; }
      .recipe-layout { grid-template-columns:240px 1fr; gap:24px; }
      .recipe-sidebar { position:static; }
      .recipe-image { max-height:220px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Haley's Recipe Book</h1>
    <p>A searchable local collection of recipes, images, categories, and tags.</p>
  </header>

  <section class="controls" aria-label="Recipe filters">
    <input id="search" type="search" placeholder="Search recipes, ingredients, or tags…">
    <select id="category"><option value="">All categories</option></select>
    <select id="tag"><option value="">All tags</option></select>
  </section>

  <div class="layout">
    <aside>
      <p class="count" id="count"></p>
      <div class="cards" id="cards"></div>
    </aside>
    <main id="reader">
      <div class="empty">Select a recipe to open it.</div>
    </main>
  </div>

  <script src="recipes.js"></script>
  <script>
    const recipes = window.RECIPE_DATA || [];
    const cards = document.getElementById('cards');
    const reader = document.getElementById('reader');
    const search = document.getElementById('search');
    const category = document.getElementById('category');
    const tag = document.getElementById('tag');
    const count = document.getElementById('count');

    [...new Set(recipes.map(r => r.category))].sort().forEach(v => {
      const o=document.createElement('option'); o.value=v; o.textContent=v; category.appendChild(o);
    });
    [...new Set(recipes.flatMap(r => r.tags))].sort().forEach(v => {
      const o=document.createElement('option'); o.value=v; o.textContent=v; tag.appendChild(o);
    });

    function glanceRow(label, value) {
      return value ? `<div class="glance-row"><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd></div>` : '';
    }

    function openRecipe(r) {
      document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', Number(c.dataset.id)===r.id));
      reader.innerHTML = `
        <div class="recipe-header">
          <div class="category">${escapeHtml(r.category)}</div>
          <h1 class="recipe-title">${escapeHtml(r.title)}</h1>
        </div>
        <div class="recipe-layout">
          <aside class="recipe-sidebar">
            ${r.image ? `<img class="recipe-image" src="${r.image}" alt="${escapeHtml(r.title)}">` : ''}
            <section class="glance-card" aria-label="Recipe at a glance">
              <h2>At a Glance</h2>
              <dl class="glance-list">
                ${glanceRow('Servings', r.servings)}
                ${glanceRow('Prep', r.prep_time)}
                ${glanceRow('Cook', r.cook_time)}
                ${glanceRow('Total', r.total_time)}
                ${glanceRow('Rating', r.rating)}
                ${glanceRow('Category', r.category)}
              </dl>
            </section>
            ${r.tags.length ? `<div class="tag-wrap">${r.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          </aside>
          <div>
            <article class="recipe-body">${r.html}</article>
            ${r.source ? `<div class="source"><strong>Original recipe:</strong> <a href="${escapeAttr(r.source)}" target="_blank" rel="noopener">${escapeHtml(r.source)}</a></div>` : ''}
          </div>
        </div>
      `;
      if (window.innerWidth < 850) reader.scrollIntoView({behavior:'smooth'});
    }

    function escapeHtml(s='') {
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }
    function escapeAttr(s='') { return escapeHtml(s); }

    function render() {
      const q = search.value.trim().toLowerCase();
      const cat = category.value;
      const tg = tag.value;
      const filtered = recipes.filter(r =>
        (!q || r.search.includes(q)) &&
        (!cat || r.category === cat) &&
        (!tg || r.tags.includes(tg))
      );
      count.textContent = `${filtered.length} of ${recipes.length} recipes`;
      cards.innerHTML = '';
      filtered.forEach(r => {
        const b=document.createElement('button');
        b.className='card'; b.type='button'; b.dataset.id=r.id;
        b.innerHTML=`
          ${r.image ? `<img src="${r.image}" alt="">` : ''}
          <div class="card-body">
            <h3>${escapeHtml(r.title)}</h3>
            <div class="meta">${escapeHtml(r.category)}${r.total_time ? ` · ${escapeHtml(r.total_time)}` : ''}</div>
          </div>`;
        b.addEventListener('click',()=>openRecipe(r));
        cards.appendChild(b);
      });
      if (filtered.length === 1) openRecipe(filtered[0]);
    }

    [search,category,tag].forEach(el=>el.addEventListener('input',render));
    render();
    if (recipes.length) openRecipe(recipes[0]);
  </script>
</body>
</html>
